<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" role="img" aria-labelledby="title desc">
  <title id="title">Impacto da internet nos estudos</title>
  <desc id="desc">Gráfico de barras comparando horas semanais de estudo entre jovens com acesso estável e acesso instável à internet.</desc>
  <rect width="720" height="430" rx="12" fill="#fbfaff"/>
  <text x="360" y="42" fill="#24133f" font-size="24" font-family="Inter, Arial, sans-serif" font-weight="700" text-anchor="middle">Horas de estudo por semana</text>
  <g stroke="#ddd5ea" stroke-width="1">
    <line x1="95" y1="340" x2="650" y2="340"/>
    <line x1="95" y1="275" x2="650" y2="275"/>
    <line x1="95" y1="210" x2="650" y2="210"/>
    <line x1="95" y1="145" x2="650" y2="145"/>
    <line x1="95" y1="80" x2="650" y2="80"/>
  </g>
  <g fill="#718096" font-size="14" font-family="Inter, Arial, sans-serif" text-anchor="end">
    <text x="82" y="345">0</text><text x="82" y="280">5</text><text x="82" y="215">10</text><text x="82" y="150">15</text><text x="82" y="85">20</text>
  </g>
  <rect x="180" y="197" width="150" height="143" rx="8" fill="#7c3aed"/>
  <rect x="430" y="107" width="150" height="233" rx="8" fill="#a855f7"/>
  <g fill="#24133f" font-family="Inter, Arial, sans-serif" font-weight="700" text-anchor="middle">
    <text x="255" y="185" font-size="20">11 h</text><text x="505" y="95" font-size="20">18 h</text>
    <text x="255" y="380" font-size="16">Internet instável</text><text x="505" y="380" font-size="16">Internet estável</text>
  </g>
  <text x="360" y="410" fill="#718096" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle">Comparação ilustrativa de estudos extracurriculares</text>
</svg>
